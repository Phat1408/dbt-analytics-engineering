version: 2

models:
  - name: stg_jaffle_shop_customer
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: order_id
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      
  - name: stg_jaffle_shop_orders
    config:
      materialized: view
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              arguments: 
                values: [completed, shipped, returned, return_pending, placed]

      - name: customer_id
        data_tests:
        - relationships:
            arguments:
              to: ref('stg_jaffle_customer')
              field: customer_id
                